[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worker"
version = "2.1.0"
authors = [
    { name = "Mario Winkler", email = "mario.winkler@dlr.de" },
    { name = "Jonas Eberle", email = "jonas.eberle@dlr.de" },
    { name = "Markus Kunze", email = "markus.kunze@dlr.de" }
]
description = "A worker implementation for the EOEPCA Registration BB BPMN workflow engine"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click == 8.2.1",
    "requests == 2.32.5",
    "fastapi[standard] == 0.115.14",
    "stactools-landsat == 0.5.0",
    "stactools-sentinel1 == 0.8.0",
    "stactools-sentinel2 == 0.8.0",
    "stactools-sentinel3 == 0.5.0",
    "setuptools == 80.9.0",
    "blake3 == 1.0.8",
    "fsspec == 2024.12.0",
    "s3fs == 2024.12.0",
    "eodm == 0.2.0",
    "operaton-external-task-client-python3 == 1.0.4",
    "httpx == 0.27.2",
    "pystac == 1.14.1",
    "pystac-client == 0.7.7",
    "eodag[usgs]==4.4.0",
    "annotated-types == 0.7.0",
    "certifi == 2026.6.17",
    "charset-normalizer == 3.4.9",
    "googleapis-common-protos == 1.75.0",
    "grpcio == 1.82.1",
    "idna == 3.18",
    "opentelemetry-api == 1.43.0",
    "opentelemetry-exporter-otlp == 1.43.0",
    "opentelemetry-exporter-otlp-proto-common == 1.43.0",
    "opentelemetry-exporter-otlp-proto-grpc == 1.43.0",
    "opentelemetry-exporter-otlp-proto-http == 1.43.0",
    "opentelemetry-proto == 1.43.0",
    "opentelemetry-sdk == 1.43.0",
    "opentelemetry-semantic-conventions == 0.64b0",
    "operaton_external_task_client_python3 == 1.0.4",
    "protobuf == 7.35.1",
    "pydantic == 2.13.4",
    "pydantic_core == 2.46.4",
    "typing-inspection == 0.4.2",
    "typing_extensions == 4.16.0",
    "urllib3 == 2.7.0"
]

[project.optional-dependencies]
dev = [
    "ruff == 0.15.14"
]
test = [
    "pytest == 9.0.2",
    "pytest-mock== 3.15.1"
]

[project.urls]
Homepage = "https://github.com/EOEPCA/registration-harvester"
Issues = "https://github.com/EOEPCA/registration-harvester/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-q --import-mode=importlib --no-header -rfE --disable-warnings --log-level=INFO"
testpaths = [
    "tests"
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s.%(msecs)03d %(levelname)s %(message)s"
log_cli_date_format = "%Y-%m-%dT%H:%M:%S"

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"